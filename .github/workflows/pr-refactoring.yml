name: PR Refactoring Agent

on:
  issue_comment:
    types: [created]

jobs:
  refactor:
    # Only run on PR comments containing /cs-agent
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '/cs-agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run refactoring agent
        uses: codescene-oss/pr-refactoring-agent@temporary-release-branch
        with:
          pr_number: ${{ github.event.issue.number }}
          command: ${{ github.event.comment.body }}
          model: 'github-copilot/claude-sonnet-4.6'
          release_token: ${{ secrets.CODESCENE_OSS_RELEASE_TOKEN }}
          codescene_token: ${{ secrets.PR_AGENT_CODESCENE_ACCESS_TOKEN }}
          opencode_auth_json: ${{ secrets.PR_AGENT_OPENCODE_AUTH_JSON }}
